<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0c542e" />
    <meta name="description" content="Digi-Laptop — sistem operasional DIGITAL LAPTOP JOMBANG." />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Digi-Laptop — DIGITAL LAPTOP JOMBANG</title>
  </head>
  <body>
    <div id="app"><div class="loading-screen"><img class="brand-mark" src="/store-logo-transparent.png" alt="Logo DIGITAL LAPTOP JOMBANG" /><p>Menyiapkan Digi-Laptop…</p></div></div>
    <script>
      const fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.media = 'print';
      fonts.href = 'https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Playball&family=Sora:wght@500;600;700;800&display=swap';
      fonts.addEventListener('load', () => { fonts.media = 'all'; }, { once: true });
      document.head.append(fonts);
      setTimeout(() => {
        const loading = document.querySelector('#app > .loading-screen');
        if (!loading || loading.querySelector('button')) return;
        const notice = document.createElement('p');
        notice.setAttribute('role', 'status');
        notice.textContent = 'Aplikasi membutuhkan waktu lebih lama dari biasanya.';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'btn';
        retry.textContent = 'Muat ulang';
        retry.addEventListener('click', () => location.reload());
        loading.append(notice, retry);
      }, 12000);
    </script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
